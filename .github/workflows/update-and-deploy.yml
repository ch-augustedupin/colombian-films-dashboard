name: Update data and deploy dashboard

on:
  schedule:
    # Every Thursday at 17:00 UTC (12:00 Bogotá).
    - cron: "0 17 * * 4"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    # Code pushes only redeploy; the schedule and manual runs also refresh data.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download and convert MinCultura Excel
        run: python scripts/update_data.py
      - name: Commit data if it changed
        run: |
          if git diff --quiet -- docs/data; then
            echo "Data unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: update
    if: always() && needs.update.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
